name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      cache-dependency-path: restaurant-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: restaurant-frontend

      - name: Lint
        run: npm run lint
        working-directory: restaurant-frontend

      - name: Unit tests
        run: npm run test

      - name: "TypeScript type check (error budget: 31 pre-existing)"
        run: |
          npx tsc --noEmit 2>&1 | tee /tmp/tsc.log || true
          count=$(grep -c "error TS" /tmp/tsc.log || true)
          echo "TypeScript errors: ${count} (baseline: 31)"
          if [ "$count" -gt 31 ]; then
            echo "New TypeScript errors introduced (baseline exceeded)."
            exit 1
          fi
